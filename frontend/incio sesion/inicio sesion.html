<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Login Marqueza.C</title>
</head>

<body>
    <!-- Contenedor de formulario -->
    <div class="contenedor">
        <!-- contenedor izquierda -->
        <div class="fondo left">
            <!-- fondo de formulario -->
            <img src="../../fondo/Fondo 3.png" alt="fondo" class="fondo_img">
        </div>
        
        <!-- contenedor derecha formulario -->
        <form class="formulario right" id="formulario">
            
            <!-- titulo formulario -->
            <div class="cabecera_titulo">
                <img src="../../fondo/icono 3.png" alt="Icono" class="Icono">
                <div class="contenedor_titulo">
                    <p class="titulo">MARQUEZA</p>
                    <p class="subtitulo">Confecciones que inspiran</p>
                </div>
            </div>
            
            <!-- subtitulo formulario -->
            <h2>Iniciar sesión</h2>
            <p class="texto">Ingresa tus credenciales para acceder al sistema</p>
            
            <!-- contenedor de nombre de usuario -->
            <label>Nombre de usuario</label>
            <input type="username" placeholder="Ingresa tu nombre de usuario" class="caja_inicio" required pattern="^[A-Za-z0-9]{3,20}$" title="El nombre de usuario debe tener entre 3 y 20 caracteres y solo puede contener letras y números." id="usuario">
            
            <!-- contenedor de contraseña -->
            <label>Contraseña</label>
            <input type="password" placeholder="ingresa tu contraseña" class="caja_inicio" required id="contraseña">
            
            <!-- recordar y olvidaste tu contraseña -->
            <div class="options">
                <label><input type="checkbox" style="width:auto;"> Recordarme</label>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
            
            <!-- boton de iniciar sesión -->
            <button type="submit">Iniciar sesión</button>
            
            <!-- pie de contenedor -->
            <div class="footer">
                © 2026 Marqueza.C - Todos los derechos reservados
            </div>
        </form>

    </div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="inicio_sesion.js"></script>
</body>

</html>
