<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="estilo.css">
    <title>Iniciar sesión | MARQUEZA</title>
</head>

<body>
    <!-- Contenedor de formulario -->
    <div class="contenedor">
        <!-- contenedor izquierda -->
        <div class="fondo left">
            <!-- fondo de formulario -->
            <img src="../fondo/Fondo 3.png" alt="fondo" class="fondo_img">
        </div>
        
        <!-- contenedor derecha formulario -->
        <form class="formulario right" id="formulario">
            
            <!-- titulo formulario -->
            <div class="cabecera_titulo">
                <img src="../fondo/icono 3.png" alt="Icono" class="Icono">
                <div class="contenedor_titulo">
                    <p class="titulo">MARQUEZA</p>
                    <p class="subtitulo">Confecciones que inspiran</p>
                </div>
            </div>
            
            <!-- subtitulo formulario -->
            <h2>Iniciar sesión</h2>
            <p class="texto">Accede a tu espacio de trabajo y continúa gestionando MARQUEZA.</p>
            
            <!-- contenedor de nombre de usuario -->
            <div class="campo-login">
                <label for="usuario">Nombre de usuario</label>
                <div class="input-shell"><i class="bx bx-user" aria-hidden="true"></i><input type="text" placeholder="Ingresa tu nombre de usuario" class="caja_inicio" required pattern="^[A-Za-z0-9]{3,20}$" autocomplete="username" title="El nombre de usuario debe tener entre 3 y 20 caracteres y solo puede contener letras y números." id="usuario"></div>
            </div>
            
            <!-- contenedor de contraseña -->
            <div class="campo-login">
                <label for="contraseña">Contraseña</label>
                <div class="input-shell"><i class="bx bx-lock-alt" aria-hidden="true"></i><input type="password" placeholder="Ingresa tu contraseña" class="caja_inicio" required autocomplete="current-password" id="contraseña"></div>
            </div>
            
            <!-- recordar y olvidaste tu contraseña -->
            <div class="options">
                <label><input type="checkbox" class="check-recordarme"> Recordarme</label>
                <a href="../olvido_contrasena/recuperar.html">¿Olvidaste tu contraseña?</a>
            </div>
            
            <!-- boton de iniciar sesión -->
            <button type="submit" class="login-submit"><span>Iniciar sesión</span><i class="bx bx-right-arrow-alt" aria-hidden="true"></i></button>

            <p class="security-note"><i class="bx bx-shield-quarter"></i> Tus datos se utilizan únicamente para validar el acceso.</p>
            
            <!-- pie de contenedor -->
            <div class="footer">
                © 2026 Marqueza.C - Todos los derechos reservados
            </div>
        </form>

    </div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../shared/theme-persistence.js"></script>
<script src="inicio_sesion.js"></script>
</body>

</html>
