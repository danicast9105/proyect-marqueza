                <div class="texto texto_titulo">
                    <span class="titulo">MARQUEZA</span>
                    <span class="subtitulo">confecciones que inspiran</span>
                </div>
            </div>

            <!-- Flecha (desktop) -->
            <i class='bx bx-chevron-right toggle'></i>

            <!-- Hamburger (tablet / móvil) — oculto en desktop vía CSS -->
            <div class="hamburger" id="hamburger" aria-label="Abrir menú" role="button" tabindex="0">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <!-- ── Menú principal ── -->
        <!-- Contenedor del menú de navegación -->
        <div class="barra_menu">
            <div class="menu">
                <!-- Lista de enlaces de navegación -->
                <ul class="links_menu">
                    <li class="nav_links">
                        <a href="../inicio/inicio.html">
                            <i class='bx bx-home-alt icon'></i>
                            <span class="texto nav_texto">Inicio</span>
                        </a>
                    </li>
                    <li class="nav_links">
                        <a href="../ventas/ventas.html">
                            <i class='bx bx-task icon'></i>
                            <span class="texto nav_texto">Ventas</span>
                        </a>
                    </li>
                    <li class="nav_links">
                        <a href="../productos/productos.html">
                            <i class='bx bxs-t-shirt icon'></i>
                            <span class="texto nav_texto">Productos</span>
                        </a>
                    </li>
                    <li class="nav_links">
                        <a href="../ventas/ventas.html">
                            <i class='bx bx-money-withdraw icon'></i>
                            <span class="texto nav_texto">Pedidos</span>
                        </a>
                    </li>
                    <li class="nav_links">
                        <a href="#">
                            <i class='bx bx-book-content icon'></i>
                            <span class="texto nav_texto">Cotizaciones</span>
                        </a>
                    </li>
                    <li class="nav_links">

                <li>
                    <a href="#">
                        <i class='bx bx-log-out icon'></i>
                        <span class="texto nav_texto">Salir</span>
                    </a>
                </li>

                <!-- Selector de modo oscuro/claro -->
                <li class="modo">
                    <!-- Iconos de sol y luna para representar los modos -->
                    <div class="sol_luna">
                        <i class='bx bx-sun icon sol'></i>
                        <i class='bx bx-moon icon luna'></i>
                    </div>
                    <span class="texto modo_texto">Oscuro</span>

                    <div class="toggle_switch">
                        <span class="switch"></span>

    <div class="cont_2">
        <h1>Gestion de Ventas</h1>
        <div class="cont_busqueda">
            <input type="text" placeholder="Buscar insumo...">
            <button type="button" id="btnBuscar">Buscar</button>
            <button type="button" class="agregar">Agregar Venta</button>
            <button type="button" id="btnExportPdf" class="btn-pdf">Exportar PDF</button>
        </div>
        <div class="cont_filtros">
            <div class="filtro-grupo">
                <label for="filtroCategoria">Filtrar por Categoría:</label>
                <select id="filtroCategoria">
                    <option value="">Todas</option>
                    <!-- Las categorías se generan dinámicamente desde ventas.js -->
                </select>
            </div>
            <div class="filtro-estados">
                <button type="button" class="estado-btn active" data-status="Todos">Todos</button>
                <button type="button" class="estado-btn" data-status="Bajo">Bajo</button>
                <button type="button" class="estado-btn" data-status="Medio">Medio</button>
                <button type="button" class="estado-btn" data-status="Bueno">Bueno</button>
            </div>
        </div>

        <!-- Contenedor de la Tabla de Datos -->
        <div class="cont_tabla">
<table><thead><tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Cantidad</th><th>Total</th><th>Editar</th><th>Eliminar</th></tr></thead>
<tbody></tbody></table></div>
    </div>

    <!-- Ventana Modal para Agregar Venta -->
    <div id="modalVenta" class="modal-container">
<div class="modal-content"><header><h2>Agregar Ventas</h2><i class='bx bx-x' id="cerrarModal"></i></header>
<form id="formVenta">
<div class="input-group"><label for="fecha">Fecha</label><input id="fecha" type="date" required placeholder=""></div><div class="input-group"><label for="cliente">Cliente</label><input id="cliente" type="text" required placeholder="Cliente"></div><div class="input-group"><label for="producto">Producto</label><input id="producto" type="text" required placeholder="Producto"></div><div class="input-group"><label for="cantidad">Cantidad</label><input id="cantidad" type="number" required placeholder="Cantidad"></div><div class="input-group"><label for="total">Total</label><input id="total" type="number" required placeholder="Total"></div>
<div class="modal-buttons"><button type="button" class="btn-secundario" id="btnCancelar">Cancelar</button><button type="submit" class="btn-primario">Guardar</button></div>
</form></div></div>
<script src="../shared/navigation.js"></script>
<script src="../shared/theme-persistence.js"></script>
<script src="../shared/app-shell.js"></script>
<script src="../shared/crud-page.js"></script>
<script src="ventas.js"></script>
