services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "5000"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MARIADB_USER:-marqueza_app}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:?Define MARIADB_PASSWORD en Dokploy}
      MYSQL_DB: marqueza_db
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-15}
      FRONTEND_RESET_URL: ${FRONTEND_RESET_URL:-http://localhost:5000/frontend/olvido_contrasena/restablecer.html}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en Dokploy}
      MARIADB_DATABASE: marqueza_db
      MARIADB_USER: ${MARIADB_USER:-marqueza_app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Define MARIADB_PASSWORD en Dokploy}
    volumes:
      - marqueza_db_data:/var/lib/mysql
      - ./database_marqueza.sql:/docker-entrypoint-initdb.d/001-marqueza.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --host=127.0.0.1 --user=root --password=\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  marqueza_db_data:
